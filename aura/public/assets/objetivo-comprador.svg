<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2638"/><stop offset="1" stop-color="#1b1622"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb451"/><stop offset="1" stop-color="#ff7657"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb451" stop-opacity=".55"/><stop offset="1" stop-color="#ffb451" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- pizarrón -->
  <rect x="60" y="70" width="330" height="190" rx="10" fill="#243b35"/>
  <rect x="60" y="70" width="330" height="190" rx="10" fill="none" stroke="#3a2f44" stroke-width="10"/>
  <g stroke="#cfe3da" stroke-width="3" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M95 115h60M95 140h110M95 165h80"/>
    <path d="M230 120c20-30 40 30 60 0s40 30 60 0"/>
    <path d="M230 200h120M245 185v30"/>
  </g>

  <!-- reloj: 10 minutos -->
  <circle cx="490" cy="130" r="58" fill="#f7f5f2"/>
  <circle cx="490" cy="130" r="58" fill="none" stroke="#3a2f44" stroke-width="8"/>
  <path d="M490 130 L490 80 A50 50 0 0 1 533.3 105 Z" fill="#ff7657" opacity=".85"/>
  <path d="M490 130V92M490 130l24 14" stroke="#15131b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="490" cy="130" r="5" fill="#15131b"/>

  <!-- banca -->
  <rect x="40" y="560" width="520" height="26" rx="8" fill="#4a3d55"/>
  <rect x="80" y="586" width="16" height="140" fill="#3a2f44"/>
  <rect x="504" y="586" width="16" height="140" fill="#3a2f44"/>

  <!-- estudiante -->
  <path d="M190 560c0-95 50-150 110-150s110 55 110 150z" fill="#5166c7"/>
  <path d="M300 410c-22 0-40 12-40 12l40 40 40-40s-18-12-40-12z" fill="#43559f"/>
  <circle cx="300" cy="350" r="52" fill="#c98a67"/>
  <path d="M248 346c0-40 24-62 54-62s52 20 52 52c-16-14-40-20-62-12-18 7-30 14-44 22z" fill="#15131b"/>
  <!-- brazos hacia el celular -->
  <path d="M230 470c10 40 40 60 70 58" stroke="#5166c7" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M370 470c-10 40-40 60-70 58" stroke="#43559f" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- brillo del celular -->
  <circle cx="300" cy="455" r="150" fill="url(#glow)"/>
  <!-- celular -->
  <rect x="262" y="440" width="76" height="120" rx="14" fill="#15131b"/>
  <rect x="268" y="448" width="64" height="104" rx="10" fill="#f7f5f2"/>
  <rect x="274" y="458" width="52" height="30" rx="7" fill="url(#win)"/>
  <path d="M292 466h16l-2 14h-12z" fill="#15131b"/>
  <rect x="274" y="496" width="40" height="6" rx="3" fill="#15131b" opacity=".7"/>
  <rect x="274" y="508" width="28" height="6" rx="3" fill="#15131b" opacity=".35"/>
  <rect x="274" y="526" width="52" height="16" rx="8" fill="#1f8a61"/>

  <!-- notificación flotante -->
  <g transform="translate(360 300) rotate(4)">
    <rect width="190" height="74" rx="18" fill="#fff"/>
    <circle cx="36" cy="37" r="20" fill="#e1f4eb"/>
    <path d="M27 37l7 7 13-14" stroke="#1f8a61" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="24" width="100" height="10" rx="5" fill="#15131b"/>
    <rect x="66" y="42" width="70" height="8" rx="4" fill="#706a78" opacity=".6"/>
  </g>
</svg>
