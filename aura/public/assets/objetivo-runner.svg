<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb451"/><stop offset=".55" stop-color="#ff8a5c"/><stop offset="1" stop-color="#3a2f44"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>
  <circle cx="470" cy="150" r="60" fill="#ffe1b8" opacity=".85"/>

  <!-- edificios del campus -->
  <g fill="#3a2f44">
    <rect x="-10" y="250" width="200" height="300"/>
    <rect x="200" y="300" width="150" height="250"/>
    <rect x="360" y="220" width="260" height="330"/>
  </g>
  <g fill="#ffd38f" opacity=".85">
    <rect x="20" y="285" width="30" height="40"/><rect x="70" y="285" width="30" height="40"/><rect x="120" y="285" width="30" height="40"/>
    <rect x="20" y="350" width="30" height="40"/><rect x="120" y="350" width="30" height="40"/>
    <rect x="225" y="330" width="100" height="18"/><rect x="225" y="365" width="100" height="18"/><rect x="225" y="400" width="100" height="18"/>
    <rect x="390" y="255" width="40" height="30"/><rect x="450" y="255" width="40" height="30"/><rect x="510" y="255" width="40" height="30"/>
    <rect x="390" y="305" width="40" height="30"/><rect x="510" y="305" width="40" height="30"/>
  </g>
  <!-- puerta del salón (destino) -->
  <rect x="470" y="420" width="70" height="130" rx="6" fill="#15131b"/>
  <circle cx="527" cy="490" r="5" fill="#ffb451"/>
  <rect x="478" y="396" width="54" height="22" rx="6" fill="#fff"/>
  <rect x="488" y="404" width="34" height="6" rx="3" fill="#15131b"/>

  <!-- árboles -->
  <g fill="#1f8a61">
    <circle cx="190" cy="500" r="48"/><circle cx="150" cy="520" r="36"/><circle cx="360" cy="515" r="40"/>
  </g>
  <rect x="186" y="530" width="10" height="30" fill="#15131b"/>
  <rect x="356" y="540" width="10" height="20" fill="#15131b"/>

  <!-- piso y camino -->
  <rect x="0" y="550" width="600" height="250" fill="#26202c"/>
  <path d="M-20 800 C120 700 300 650 505 555" stroke="#4a3d55" stroke-width="70" fill="none"/>
  <path d="M40 760 C170 680 330 630 500 560" stroke="#ffb451" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" fill="none"/>

  <!-- runner -->
  <g transform="translate(250 430)">
    <!-- piernas -->
    <path d="M40 150 L10 215 L-20 222" stroke="#15131b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M52 150 L92 196 L118 180" stroke="#2a2433" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- mochila -->
    <rect x="-8" y="70" width="44" height="66" rx="14" fill="#ff7657"/>
    <!-- torso -->
    <path d="M20 70c14-12 44-12 56 6l-6 78H24z" fill="#f7f5f2"/>
    <!-- brazo atrás -->
    <path d="M30 88 L2 128" stroke="#e8e2dc" stroke-width="18" stroke-linecap="round"/>
    <!-- brazo adelante con el café -->
    <path d="M66 88 L96 110 L118 92" stroke="#f7f5f2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="112" y="62" width="30" height="7" rx="3.5" fill="#15131b"/>
    <path d="M114 69h26l-3 30h-20z" fill="#15131b"/>
    <rect x="116" y="78" width="22" height="8" fill="#ffb451"/>
    <!-- cabeza -->
    <circle cx="54" cy="36" r="30" fill="#8a5a3f"/>
    <path d="M26 30c2-24 20-34 38-30 14 3 22 14 20 24-14-8-34-8-58 6z" fill="#15131b"/>
  </g>
  <!-- líneas de velocidad -->
  <g stroke="#f7f5f2" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M150 520h60M130 550h70M160 580h40"/>
  </g>
</svg>
