<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraCafé — Panel Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🏃</div>
      <div class="brand-text">
        <div class="display">Ana R.</div>
        <small>Runner desde hoy</small>
      </div>
    </div>
    <div class="avail-toggle">
      <span style="font-size:12px;font-weight:600;">Disponible</span>
      <div class="toggle on" id="availToggle"></div>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statEarnings">$0</div>
      <div class="lbl">Ganancias hoy</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statDeliveries">0</div>
      <div class="lbl">Entregas hoy</div>
    </div>
    <div class="stat-card">
      <div class="num">$10</div>
      <div class="lbl">Por entrega</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabAvail">Disponibles <span class="badge" id="badgeAvail">0</span></button>
    <button class="tab" id="tabMine">Mis entregas <span class="badge" id="badgeMine">0</span></button>
  </div>

  <div class="order-list" id="orderList"><!-- JS --></div>

  <div style="padding:0 20px 24px;">
    <a href="index.html" class="switch-view" style="background:var(--ink);display:inline-flex;">🛒 Ver vista cliente</a>
  </div>

</div>

<script src="app.js"></script>
<script src="runner.js"></script>
</body>
</html>
