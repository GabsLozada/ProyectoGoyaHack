<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura — Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body class="app-page runner-page">
<header class="site-nav runner-nav">
  <a class="brand" href="dashboard.html">
    <div class="brand-mark">A</div>
    <div class="brand-text"><div class="display">Aura</div><small>Modo Runner</small></div>
  </a>
  <a href="dashboard.html" class="nav-ghost">← Mi cuenta</a>
</header>

<main class="runner-main">
  <section class="runner-hero">
    <div>
      <span class="app-kicker">AURA · RUNNER</span>
      <h1>Pedidos disponibles</h1>
      <p>Cuando un comprador confirma, su pedido aparece aquí.</p>
    </div>
    <div class="runner-summary">
      <small>Entregas completadas</small><strong id="runnerDeliveries">0</strong>
    </div>
  </section>

  <section class="runner-section">
    <div class="runner-panel-head"><div><span class="section-label">DISPONIBLES</span><h2>Listos para tomar</h2></div><span class="live-pill"><i></i> En vivo</span></div>
    <div class="order-list" id="availableOrders"></div>
  </section>

  <section class="runner-section">
    <div class="runner-panel-head"><div><span class="section-label">MIS RECORRIDOS</span><h2>Pedidos que aceptaste</h2></div></div>
    <div class="order-list" id="runnerActiveOrders"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
