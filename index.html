<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraCafé — Tu antojo, en tu salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">☕</div>
      <div class="brand-text">
        <div class="display">AuraCafé</div>
        <small>Campus delivery</small>
      </div>
    </div>
    <a href="runner.html" class="switch-view">🏃 Modo Runner</a>
  </header>

  <div id="menuView">
    <section class="hero">
      <h1>Tu antojo, en tu salón, antes del timbre.</h1>
      <p>Pide en 30 segundos. Un runner de la facultad te lo lleva directo a tu salón mientras vas a tu siguiente clase.</p>
      <div style="margin-top:12px;"><span class="live-pill"><span class="live-dot"></span> 6 runners activos ahora</span></div>
    </section>

    <div class="route" aria-hidden="true">
      <div class="route-line"></div>
      <div class="route-node">☕</div>
      <div class="route-node end">🎒</div>
      <div class="route-runner">🏃</div>
    </div>

    <div class="section-head">
      <h2>¿Qué se te antoja?</h2>
      <span>4 opciones</span>
    </div>

    <div class="product-list" id="productList"><!-- JS --></div>
  </div>

  <div id="trackingView" style="display:none;"></div>

  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-info">
      <div class="cart-count" id="cartCount">0</div>
      <div class="cart-bar-total" id="cartTotal">$0.00 MXN</div>
    </div>
    <button class="cart-bar-cta" id="cartBarCta">Ver pedido →</button>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h3>¿A dónde te lo llevamos?</h3>
    <div class="chip-row" id="chipRow"><!-- JS --></div>
    <input type="text" id="locInput" class="loc-input" placeholder="Escribe tu salón, ej. Edificio Q-103">
    <div id="sheetSummary"><!-- JS --></div>
    <button class="confirm-btn" id="confirmBtn" disabled>🔒 Confirmar y pagar</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
